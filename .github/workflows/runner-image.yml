name: Build Runner Image

on:
  push:
    paths:
      - '.github/runner.Dockerfile'
      - '.github/workflows/runner-image.yml'
  workflow_dispatch:

jobs:
  build-runner:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ghcr.io only accepts GITHUB_TOKEN from public GitHub; enterprise
      # instances (GHE.com / GHES) have their own containers.<host> registry.
      - name: Resolve registry and image name
        id: image
        run: |
          host="${GITHUB_SERVER_URL#https://}"
          if [ "$host" = "github.com" ]; then
            registry=ghcr.io
          else
            registry="containers.${host}"
          fi
          echo "registry=$registry" >> "$GITHUB_OUTPUT"
          echo "name=${registry}/${GITHUB_REPOSITORY,,}/runner" >> "$GITHUB_OUTPUT"

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/runner.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
